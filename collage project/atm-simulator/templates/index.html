<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATM Simulator — Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="atm-container">
        <div class="atm-screen">
            <h1 class="atm-title">🏧 ATM SIMULATOR</h1>
            <p class="subtitle">Welcome! Please insert your card</p>

            <div class="login-form">
                <label>Account Number</label>
                <input type="text" id="accountNo" placeholder="Enter 10-digit account number" maxlength="10">

                <label>PIN</label>
                <input type="password" id="pin" placeholder="Enter 4-digit PIN" maxlength="4">

                <button id="loginBtn" class="btn-primary">LOGIN</button>
                <p class="error-msg" id="errorMsg"></p>

                <div class="hint-box">
                    <strong>Demo Credentials:</strong><br>
                    Account: <code>1234567890</code><br>
                    PIN: <code>1234</code>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
